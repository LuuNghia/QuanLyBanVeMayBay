<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyBooking - Hệ Thống Quản Trị</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --primary-navy: #003580;
            --navy-gradient: linear-gradient(90deg, #00265c 0%, #003580 100%);
            --secondary-gold: #feba02;
            --sidebar-width: 280px;
            --bg-light: #f8faff;
            --glass-white: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-light);
            margin: 0;
        }

        /* --- SIDEBAR (PHẦN DÙNG CHUNG) --- */
        #sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            background-color: var(--primary-navy);
            position: fixed;
            left: 0;
            top: 0;
            z-index: 1001;
            padding: 20px 0;
        }

        .sidebar-brand {
            padding: 0 25px 30px;
            color: white;
            font-weight: 700;
            font-size: 22px;
            letter-spacing: 1px;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.7);
            padding: 12px 25px;
            margin: 4px 15px;
            border-radius: 12px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .nav-link i {
            font-size: 1.2rem;
            margin-right: 15px;
        }

        .nav-link:hover,
        .nav-link.active {
            color: white;
            background: rgba(255, 255, 255, 0.1);
        }

        .nav-link.active {
            background: var(--secondary-gold) !important;
            color: var(--primary-navy) !important;
            font-weight: 600;
        }

        /* --- TOPBAR GRADIENT (PHẦN DÙNG CHUNG) --- */
        .topbar {
            margin-left: var(--sidebar-width);
            background: var(--navy-gradient);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .search-box {
            background: var(--glass-white);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 8px 20px;
            width: 400px;
            backdrop-filter: blur(10px);
        }

        .search-box input {
            background: transparent;
            border: none;
            color: white;
            outline: none;
            width: 100%;
        }

        .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .avatar-ad {
            width: 42px;
            height: 42px;
            background: var(--secondary-gold);
            color: var(--primary-navy);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            border: 2px solid white;
        }
    </style>
</head>

<body>

    <div id="sidebar">
        <div class="sidebar-brand">
            <i class="bi bi-airplane-engines-fill me-2 text-warning"></i>SkyBooking
            <div style="font-size: 10px; opacity: 0.6; letter-spacing: 1px;">HỆ THỐNG QUẢN TRỊ</div>
        </div>
        <nav class="nav flex-column">
            <a href="../Admin/DashBoard.html" class="nav-link"><i class="bi bi-grid-fill"></i> Tổng quan</a>
            <a href="../Admin/SanBayVaTuyenBay.html" class="nav-link active"><i class="bi bi-geo-alt-fill"></i> Sân bay & Tuyến bay</a>
            <a href="../Admin/QuanLyChuyenBay.html" class="nav-link"><i class="bi bi-airplane-fill"></i> Quản lý Chuyến bay</a>
            <a href="../Admin/SoDoGhe.html" class="nav-link"><i class="bi bi-grid-3x3-gap"></i> Máy bay & Sơ đồ ghế</a>
            <a href="../Admin/QuanLyDatVe.html" class="nav-link"><i class="bi bi-ticket-perforated-fill"></i> Quản lý Đặt vé</a>
            <a href="../Admin/NhanVienVaKhachHang.html" class="nav-link"><i class="bi bi-people-fill"></i> Nhân viên & Khách hàng</a>
            <a href="../Admin/CauHinhHeThong.html" class="nav-link"><i class="bi bi-gear-fill"></i> Cấu hình hệ thống</a>
        </nav>
        <div style="position: absolute; bottom: 20px; width: 100%;">
            <a href="#" class="nav-link text-danger"><i class="bi bi-box-arrow-left"></i> Đăng xuất</a>
        </div>
    </div>

    <div class="topbar">
        <div class="search-box d-flex align-items-center">
            <i class="bi bi-search text-white opacity-50 me-2"></i>
            <input type="text" placeholder="Tìm kiếm chuyến bay, hành khách...">
        </div>
        <div class="d-flex align-items-center text-white">
            <i class="bi bi-bell-fill me-4 fs-5 cursor-pointer"></i>
            <i class="bi bi-question-circle me-4 fs-5 cursor-pointer"></i>
            <div class="d-flex align-items-center">
                <div class="text-end me-3">
                    <div class="fw-bold small">Nguyễn Admin</div>
                    <div class="opacity-75 small">Quản trị viên</div>
                </div>
                <div class="avatar-ad shadow-sm">AD</div>
            </div>
        </div>
    </div>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
